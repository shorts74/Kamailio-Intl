[Definition]
# Matches the exact format written by blueprints_auth.py's login()
# route on a failed attempt -- see that file for the log line itself.
# <HOST> is fail2ban's standard placeholder, matches an IPv4/IPv6
# address; ProxyFix (app.py) ensures this is the real client IP, not
# nginx's own 127.0.0.1 (nginx sits in front of this app).
failregex = ^FAILED_LOGIN from=<HOST> user=
ignoreregex =
