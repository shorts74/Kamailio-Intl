# ============================================================
# manager.conf -- site-specific configuration for the Kamailio Manager
# Copy to manager.conf and fill in before running manager-install.sh
#
# IMPORTANT -- how re-running this script actually behaves:
#
# manager-install.sh is checkpointed/resumable. Completed steps are
# tracked as marker files in /var/lib/kamailio-manager-install/,
# COMPLETELY SEPARATE from this config file and the script itself.
# This means:
#
#   - Uploading a newer manager-install.sh and running it again will
#     SKIP every step that already succeeded before -- this is
#     intentional (lets you resume cleanly after fixing an unrelated
#     failure without redoing a lengthy build from scratch), but it
#     also means bug fixes in already-completed steps won't take
#     effect on a plain re-run.
#
#   - To force EVERY step to re-run (keeping existing data/databases):
#       FORCE_REINSTALL_ALL=yes ./manager-install.sh
#
#   - To genuinely start over from scratch, including a real,
#     double-confirmed wipe of the kamailio/homer_data/homer_config
#     databases:
#       rm -rf /var/lib/kamailio-manager-install
#       ./manager-install.sh
#     (this will detect the existing databases and walk you through
#     typing 'yes' then the exact phrase 'DELETE ALL DATA' before
#     touching anything -- see CONFIRM_WIPE_EXISTING_DATA below for
#     the non-interactive equivalent)
#
#   - Regardless of the above, every run always ends with an "ensure
#     all services are actually running" pass that's independent of
#     checkpoints entirely -- so even a run where everything gets
#     skipped will still correctly (re)start any stopped service.
# ============================================================

MANAGER_IP="69.170.187.73"
MANAGER_NAME="SIPStationManager2"
MANAGER_FQDN="sipstation-manager.sangoma.cloud"

PG_ADMIN_PASS="S4ng0ma"
KAMAILIO_DB_PASS="S4ng0ma"       # avoid @ # ! -- see note in manager-install.sh
HOMER_DB_PASS="S4ng0ma"
HOMER_APP_VER="1.5.14"

# ── Branding (also changeable later via Settings -> Branding) ──
COMPANY_NAME="SIP Trunk Platform"
PRIMARY_COLOR="#4a2f52"

# DNS resolvers -- baked in by default rather than relying on the
# cloud provider's VPC resolver (matches the Node bundle's approach,
# and fixes the same class of hostname-resolution issue found during
# earlier testing of this platform).
PUBLIC_DNS_1="8.8.8.8"
PUBLIC_DNS_2="1.1.1.1"

# PostgreSQL (5432) and HEP trace ingestion (9060/9061) must stay
# reachable from every Kamailio Node's IP for sync/CDR/trace to work.
# This is the single most impactful thing to tighten post-install --
# narrow this to your actual node IP ranges/VPC CIDR(s) as soon as you
# know them (comma-separated, e.g. "10.0.0.0/8,203.0.113.0/24").
# Left wide open by default only so a fresh multi-region install
# doesn't break before you've registered your first node.
NODE_SOURCE_CIDRS="0.0.0.0/0"

# TLS via Let's Encrypt -- requires MANAGER_FQDN to be a real domain
# that already resolves to this server's public IP with port 80
# reachable from the internet. Leave "no" for private/internal
# deployments without a public domain; the install will still work
# fine over plain HTTP in that case.
ENABLE_TLS="no"

# ── Optional features ──
SKIP_SSH_HARDENING="no"            # yes to skip disabling password auth
                                    # (auto-skipped anyway if no SSH key is
                                    # present in root's authorized_keys, to
                                    # avoid any lockout risk)
ENABLE_SNMP="no"
SNMP_VERSION="v3"
SNMP_V2C_COMMUNITY="__SET_ME__"
SNMP_V3_USER="__SET_ME__"
SNMP_V3_AUTH_PASS="__SET_ME__"
SNMP_V3_PRIV_PASS="__SET_ME__"
